<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Glass Demo</title>
<link rel="stylesheet" href="../skills/apple-glass/assets/kit/liquid-glass.css">
<style>
  :root {
    --background: #f2f2f7; --foreground: #000; --popover: #fff; --card: #fff;
    --muted: rgb(60 60 67 / .6);
  }
  .dark {
    --background: #000; --foreground: #fff; --popover: #1c1c1e; --card: #1c1c1e;
    --muted: rgb(235 235 245 / .6);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--background); color: var(--foreground); }
  body {
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* Busy content, so the bend has something to bend. */
  .backdrop {
    position: fixed; inset: 0; overflow: hidden;
    background:
      radial-gradient(40% 50% at 18% 22%, #ff375f 0, transparent 70%),
      radial-gradient(35% 45% at 82% 30%, #0a84ff 0, transparent 70%),
      radial-gradient(45% 50% at 60% 85%, #30d158 0, transparent 70%),
      radial-gradient(30% 35% at 30% 75%, #ffd60a 0, transparent 70%),
      var(--background);
  }
  .backdrop .lines {
    position: absolute; inset: -50%;
    background: repeating-linear-gradient(115deg, rgb(255 255 255 / .9) 0 2px, transparent 2px 26px);
    opacity: .35;
  }
  .page { position: relative; max-width: 760px; margin: 0 auto; padding: 96px 16px 180px; }
  h1 { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: .4px; margin: 0 0 8px; }
  p.lead { color: var(--muted); margin: 0 0 32px; }
  .wall { font-size: 28px; font-weight: 700; line-height: 1.15; letter-spacing: -.5px; }
  .wall span:nth-child(3n) { color: #ff9f0a; }
  .wall span:nth-child(3n+1) { color: #64d2ff; }

  /* Floating controls: the glass layer. */
  .toolbar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; z-index: 10;
  }
  .btn {
    width: 52px; height: 52px; border-radius: 999px; border: 0; color: inherit;
    display: grid; place-items: center; font-size: 22px; cursor: pointer;
  }
  .pill { height: 52px; padding: 0 22px; border-radius: 999px; display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .tabbar {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    width: min(420px, calc(100% - 32px)); height: 68px; border-radius: 999px;
    display: flex; align-items: center; justify-content: space-around; z-index: 10;
    font-size: 11px; font-weight: 600;
  }
  .tab { display: grid; justify-items: center; gap: 2px; padding: 8px 14px; border-radius: 999px; position: relative; }
  .tab b { font-size: 22px; line-height: 24px; }
  .tab.on { color: #0a84ff; }
  .tab.on::before { content: ""; position: absolute; inset: 2px -4px; border-radius: 999px; z-index: -1; }

  .drag {
    position: fixed; left: calc(50% - 130px); top: 46%; width: 260px; height: 140px;
    border-radius: 36px; z-index: 11; cursor: grab; touch-action: none;
    display: grid; place-items: center; font-weight: 600; user-select: none;
  }
  .drag:active { cursor: grabbing; }

  .controls {
    position: fixed; right: 16px; bottom: 112px; z-index: 12;
    display: grid; gap: 8px; font-size: 13px;
  }
  .controls button {
    font: inherit; color: var(--foreground); background: var(--card); border: 0;
    border-radius: 999px; padding: 8px 14px; cursor: pointer;
  }
  .controls button[aria-pressed="true"] { background: #0a84ff; color: #fff; }
</style>
</head>
<body>
<div class="backdrop"><div class="lines"></div></div>

<main class="page">
  <h1>Liquid Glass</h1>
  <p class="lead">Drag the big pane over the text. Watch the rim: the content bends in toward the edge and the curved edge catches the light. The middle stays clear.</p>
  <div class="wall" id="wall"></div>
</main>

<div class="toolbar">
  <button class="btn liquid-glass" data-lens aria-label="Back">‹</button>
  <div class="pill liquid-glass" data-lens>Library</div>
  <button class="btn liquid-glass" data-lens aria-label="More">⋯</button>
</div>

<div class="drag liquid-glass liquid-glass-clear" data-lens="clear" data-radius="36" id="drag">Drag me</div>

<nav class="tabbar liquid-glass liquid-glass-milky" data-lens>
  <div class="tab on"><b>●</b>Home</div>
  <div class="tab"><b>◎</b>Search</div>
  <div class="tab"><b>♥</b>Saved</div>
  <div class="tab"><b>☺</b>You</div>
</nav>

<div class="controls">
  <button id="lens" aria-pressed="true">Lens on</button>
  <button id="theme">Light mode</button>
</div>

<script type="module">
  import { attachLiquidGlass, supportsBackdropRefraction } from "../skills/apple-glass/assets/kit/liquid-lens.js";

  const words = "Glass bends the light that passes through its edge so the content behind is pulled toward the rim while the face stays flat and clear ".split(" ");
  document.getElementById("wall").innerHTML = Array.from({ length: 260 }, (_, i) => `<span>${words[i % words.length]}</span>`).join(" ");

  let detach = [];
  const on = () => {
    detach = [...document.querySelectorAll("[data-lens]")].map((el) =>
      attachLiquidGlass(el, {
        variant: el.dataset.lens === "clear" ? "clear" : "regular",
        radius: el.dataset.radius ? Number(el.dataset.radius) : undefined,
      }),
    );
  };
  const off = () => { detach.forEach((f) => f()); detach = []; };
  // ?light and ?nolens, for screenshots and side-by-side comparisons.
  const q = new URLSearchParams(location.search);
  if (q.has("light")) document.documentElement.classList.remove("dark");
  if (!q.has("nolens")) on();

  const lensBtn = document.getElementById("lens");
  if (!supportsBackdropRefraction()) { lensBtn.textContent = "Lens: Chromium only"; lensBtn.disabled = true; }
  lensBtn.onclick = () => {
    const pressed = lensBtn.getAttribute("aria-pressed") === "true";
    lensBtn.setAttribute("aria-pressed", String(!pressed));
    lensBtn.textContent = pressed ? "Lens off" : "Lens on";
    pressed ? off() : on();
  };
  document.getElementById("theme").onclick = (e) => {
    const dark = document.documentElement.classList.toggle("dark");
    e.target.textContent = dark ? "Light mode" : "Dark mode";
  };

  const drag = document.getElementById("drag");
  let start = null;
  drag.addEventListener("pointerdown", (e) => {
    const r = drag.getBoundingClientRect();
    start = { x: e.clientX - r.left, y: e.clientY - r.top };
    drag.setPointerCapture(e.pointerId);
  });
  drag.addEventListener("pointermove", (e) => {
    if (!start) return;
    drag.style.left = `${e.clientX - start.x}px`;
    drag.style.top = `${e.clientY - start.y}px`;
  });
  drag.addEventListener("pointerup", () => { start = null; });
</script>
</body>
</html>
